name: Publish package

on:
  release:
    types:
      - published
  # A release created with GITHUB_TOKEN does not trigger workflows, so a release
  # that release-please created has to be published by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs an npm CLI that can exchange the OIDC token for
      # registry authorization (>= 11.5.1). Node 22 ships npm 10, whose publish is
      # unauthenticated: it still signs the provenance statement, then fails the PUT
      # with a bare 404.
      - name: Update npm
        run: npm install --global npm@11.19.1

      - name: Publish to npm
        run: npm publish --access public --provenance
